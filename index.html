<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Indstaal Project Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   INDSTAAL PROJECT HUB — design tokens
   Signature: quotation IDs & data set in mono, "shop-drawing"
   corner brackets on key cards, safety-orange accent against
   steel charcoal — the visual language of a fabrication shop.
   ============================================================ */
:root{
  --sidebar-w: 224px;
  --topbar-h: 60px;

  /* Steel & Site theme (default) */
  --steel-900:#141a22;
  --steel-800:#1b2430;
  --steel-700:#26313f;
  --steel-600:#3a4a5c;
  --steel-500:#6b7684;
  --accent:#ff7a29;
  --accent-ink:#7a3400;
  --accent-2:#2ec4b6;
  --bg:#f3f4f6;
  --card:#ffffff;
  --ink:#1b2430;
  --ink-soft:#5a6472;
  --line:#e4e7eb;
  --danger:#e5484d;
  --warning:#d98c00;
  --success:#1f9d8f;
  --font-display:'Space Grotesk', system-ui, sans-serif;
  --font-body:'IBM Plex Sans', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  --radius:10px;
  --shadow: 0 1px 2px rgba(20,26,34,.06), 0 4px 16px rgba(20,26,34,.06);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;}
.mono{font-family:var(--font-mono);}
button{font-family:inherit;}
a{color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}
::selection{background:var(--accent);color:#fff;}

/* ---------- Corner-bracket signature ---------- */
.bracketed{position:relative;}
.bracketed::before,.bracketed::after{
  content:"";position:absolute;width:10px;height:10px;
  border-color:var(--accent);border-style:solid;opacity:.55;pointer-events:none;
}
.bracketed::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}
.bracketed::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}

/* ---------- App shell ---------- */
#app{display:none;}
#app.ready{display:block;}
.shell{display:flex;min-height:100vh;}

.sidebar{
  width:var(--sidebar-w);
  background:var(--steel-800);
  color:#cfd6dd;
  position:fixed;top:0;left:0;bottom:0;
  display:flex;flex-direction:column;
  z-index:40;
  transition:transform .2s ease;
}
.sidebar .brand{
  display:flex;align-items:center;gap:10px;
  padding:18px 18px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar .brand .mark{
  width:30px;height:30px;border-radius:6px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:#241000;font-size:14px;
}
.sidebar .brand .name{font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;line-height:1.15;}
.sidebar .brand .sub{font-size:10.5px;color:#8b95a1;letter-spacing:.04em;text-transform:uppercase;}

.nav{padding:10px;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:8px;margin-bottom:2px;
  font-size:13.5px;font-weight:500;color:#b9c2cc;cursor:pointer;
  border:1px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
.nav-item.active{background:rgba(255,122,41,.14);color:#fff;border-color:rgba(255,122,41,.35);}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.nav-badge{
  margin-left:auto;background:var(--accent);color:#241000;
  font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;
}

.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  background:rgba(255,255,255,.04);
}
.avatar{
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;
}
.user-chip .who{flex:1;min-width:0;}
.user-chip .who .n{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-chip .who .r{font-size:10.5px;color:#8b95a1;}
.logout-btn{background:none;border:none;color:#8b95a1;cursor:pointer;font-size:13px;padding:4px;}
.logout-btn:hover{color:#fff;}

.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:var(--topbar-h);background:var(--steel-800);color:#fff;
  display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.topbar .page-title{font-family:var(--font-display);font-weight:600;font-size:16px;}
.topbar .spacer{flex:1;}
.menu-toggle{display:none;background:none;border:none;color:#fff;font-size:18px;cursor:pointer;}

.tl-switcher{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tl-chip{
  padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;
  background:rgba(255,255,255,.07);color:#cfd6dd;border:1px solid rgba(255,255,255,.1);
  white-space:nowrap;
}
.tl-chip:hover{background:rgba(255,255,255,.12);}
.tl-chip.active{background:var(--accent);color:#241000;border-color:var(--accent);}
.viewing-badge{
  font-size:11.5px;background:rgba(255,122,41,.16);color:var(--accent);
  padding:4px 10px;border-radius:20px;font-weight:600;border:1px solid rgba(255,122,41,.35);
}

.icon-btn{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;
  width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:rgba(255,255,255,.14);}
.icon-btn.spinning{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--success);display:inline-block;margin-right:5px;}
.sync-dot.stale{background:var(--warning);}
.sync-dot.off{background:var(--danger);}
.sync-label{font-size:11px;color:#a9b2bc;}

.content{padding:22px;max-width:1400px;width:100%;margin:0 auto;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 15px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;
}
.btn:hover{border-color:var(--steel-600);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#241000;}
.btn-primary:hover{filter:brightness(1.05);}
.btn-danger{background:#fff;border-color:var(--danger);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--line);}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- Cards / generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:16px 18px;}
.section-head{display:flex;align-items:center;gap:10px;margin:26px 0 12px;}
.section-head:first-child{margin-top:0;}
.section-head h2{font-size:15px;font-weight:700;letter-spacing:.01em;}
.section-head .count{font-size:11.5px;color:var(--ink-soft);background:var(--line);padding:2px 8px;border-radius:20px;}

.grid{display:grid;gap:14px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.qid{font-family:var(--font-mono);font-weight:700;font-size:15px;letter-spacing:.01em;}
.qid-lg{font-size:19px;}
.rev-tag{
  font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--steel-600);
  background:var(--line);padding:1px 7px;border-radius:5px;margin-left:6px;
}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.badge-Received{background:#eef1f4;color:#48505a;}
.badge-AssignedtoTL{background:#fff2e0;color:#a05a00;}
.badge-InProgress{background:#e3f0ff;color:#1a5fb4;}
.badge-OnHold{background:#fde8e8;color:#c0292e;}
.badge-UnderChecking{background:#f3e8fd;color:#7a2ec2;}
.badge-SenttoSales{background:#e6f8f5;color:#128075;}
.badge-Completed{background:#e5f6e6;color:#1e7d24;}
.badge-delayed{background:#fde8e8;color:#c0292e;}
.badge-outline{background:transparent;border:1px solid var(--line);color:var(--ink-soft);}

.pipeline-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.pipe-step{
  flex:1;min-width:118px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;cursor:pointer;position:relative;
}
.pipe-step:hover{border-color:var(--accent);}
.pipe-step .n{font-family:var(--font-mono);font-size:22px;font-weight:700;}
.pipe-step .l{font-size:11px;color:var(--ink-soft);font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.03em;}
.pipe-step.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,122,41,.25);}

.alert-tile{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;cursor:pointer;
}
.alert-tile:hover{border-color:var(--steel-600);}
.alert-tile .num{font-family:var(--font-mono);font-size:24px;font-weight:700;}
.alert-tile.danger .num{color:var(--danger);}
.alert-tile.warning .num{color:var(--warning);}
.alert-tile.info .num{color:var(--accent-2);}

.who-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.who-card .head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.who-card .head .n{font-weight:700;font-size:14px;}
.who-card .head .role{font-size:11px;color:var(--ink-soft);}
.who-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:12.5px;}
.who-row:first-of-type{border-top:none;}
.who-row .qid{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.who-row .hrs{color:var(--ink-soft);font-family:var(--font-mono);font-size:11.5px;}
.empty-note{font-size:12.5px;color:var(--ink-soft);font-style:italic;padding:6px 0;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);
  padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr.row-delayed{background:#fff6f6;}
tr.clickable:hover{background:#f8f9fa;cursor:pointer;}
.table-wrap{overflow-x:auto;}

.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.chip-filter{
  padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;
  background:#fff;border:1px solid var(--line);color:var(--ink-soft);
}
.chip-filter.active{background:var(--steel-800);color:#fff;border-color:var(--steel-800);}
.search-input{padding:8px 12px;border-radius:8px;border:1px solid var(--line);min-width:220px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.tab-btn{padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--accent);}

/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;}
.kanban-col{flex:0 0 250px;background:#eceef1;border-radius:var(--radius);padding:10px;}
.kanban-col .kh{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:4px 6px 10px;display:flex;justify-content:space-between;}
.kcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);}
.kcard:hover{border-color:var(--accent);}
.kcard .qid{font-size:13px;}
.kcard .client{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.kcard .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--ink-soft);}

/* Work type buttons */
.wtype-grid{display:flex;gap:8px;flex-wrap:wrap;}
.wtype-btn{
  padding:10px 14px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
  font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);
}
.wtype-btn.selected{border-color:var(--accent);background:rgba(255,122,41,.1);color:var(--accent-ink);}
.wdot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.wdot-Study{background:#5b8def;}
.wdot-Estimation{background:#f2b705;}
.wdot-STAADDesign{background:#8e5bef;}
.wdot-Checking{background:#2ec4b6;}
.wdot-OtherWork{background:#9aa4af;}

/* Timesheet grid */
.tsheet{overflow-x:auto;}
.tsheet table{min-width:760px;}
.tsheet td.daycell{text-align:center;cursor:default;}
.tsheet .daytotal{font-family:var(--font-mono);font-weight:700;}
.tsheet .dots{display:flex;justify-content:center;gap:2px;margin-top:3px;}
.tsheet tr.totrow td{font-weight:700;background:#fafbfc;border-top:2px solid var(--line);}
.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.week-nav .lbl{font-weight:700;font-size:13.5px;}

/* Forms / Modal */
.overlay{position:fixed;inset:0;background:rgba(20,26,34,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:#fff;border-radius:14px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal.wide{max-width:820px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;}
.modal-head h3{font-size:16px;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff;}

.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink-soft);}
.req{color:var(--danger);margin-left:2px;}
.form-row input[type=text],.form-row input[type=number],.form-row input[type=date],.form-row select,.form-row textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;
}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:2px solid rgba(255,122,41,.4);border-color:var(--accent);}
.form-row .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:520px){.form-2col{grid-template-columns:1fr;}}

.qid-builder{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.qid-fixed{font-family:var(--font-mono);font-weight:700;color:var(--ink-soft);background:var(--line);padding:9px 8px;border-radius:6px;font-size:13px;}
.qid-builder input{font-family:var(--font-mono);font-weight:700;padding:9px 8px;width:64px;text-align:center;border:1px solid var(--line);border-radius:6px;}
.qid-preview{margin-top:8px;font-family:var(--font-mono);font-size:15px;font-weight:700;background:#fff8f2;border:1px dashed var(--accent);display:inline-block;padding:6px 10px;border-radius:6px;}

.legend-note{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
.checkbox-row{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13.5px;}
.checkbox-row input{width:18px;height:18px;}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--steel-900);padding:20px;
  background-image:radial-gradient(circle at 20% 20%, rgba(255,122,41,.08), transparent 40%), radial-gradient(circle at 80% 80%, rgba(46,196,182,.07), transparent 40%);}
.login-card{background:#fff;border-radius:16px;padding:32px 30px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.login-brand .mark{width:38px;height:38px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#241000;font-size:16px;}
.login-brand h1{font-size:17px;}
.login-brand .sub{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.pin-input{letter-spacing:8px;font-family:var(--font-mono);font-size:20px;text-align:center;}
.login-err{color:var(--danger);font-size:12.5px;margin-top:8px;}
.name-suggest{max-height:150px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;}
.name-suggest .opt{padding:8px 11px;cursor:pointer;font-size:13.5px;}
.name-suggest .opt:hover{background:var(--bg);}

.toast{position:fixed;bottom:20px;right:20px;background:var(--steel-800);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:200;max-width:320px;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}

.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:600px){.theme-grid{grid-template-columns:repeat(2,1fr);}}
.theme-card{border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;}
.theme-card.active{border-color:var(--accent);}
.theme-preview{height:44px;border-radius:6px;display:flex;overflow:hidden;margin-bottom:8px;}
.theme-preview .a{width:32%;}
.theme-preview .b{flex:1;}
.theme-card .tname{font-size:12px;font-weight:600;}

.settings-list{list-style:none;margin:0;padding:0;}
.settings-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;}
.settings-row .rn{flex:1;min-width:0;}
.settings-row .rn .n{font-weight:700;font-size:13.5px;}
.settings-row .rn .r{font-size:11.5px;color:var(--ink-soft);}
.settings-actions{display:flex;gap:6px;}

.hold-banner{background:#fde8e8;border:1px solid #f5b5b5;color:#8a1f24;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;}
.notif-flag{background:var(--accent);color:#241000;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px;}

.detail-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
@media(max-width:760px){.detail-grid{grid-template-columns:1fr;}}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.kv .k{color:var(--ink-soft);}
.kv .v{font-weight:600;text-align:right;}

.mobile-overlay{display:none;}
@media(max-width:880px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .menu-toggle{display:flex;align-items:center;justify-content:center;}
  .mobile-overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;}
  .grid-4,.grid-3{grid-template-columns:1fr 1fr;}
}
@media(max-width:520px){
  .content{padding:14px;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  .tl-switcher{display:none;}
}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .ic{font-size:34px;margin-bottom:10px;}

/* ---------------------------------------------------------
   2. DATE HELPERS  (Section 14, bug #3)
   --------------------------------------------------------- */
function toDateOnly(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
}
function formatDate(d){
  if(!d) return '—';
  const dt = (d instanceof Date) ? d : new Date(d);
  if(isNaN(dt.getTime())) return '—';
  return dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}
function todayStr(){
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}
function isDelayed(q){
  if(!q.deadline || q.status==='Completed') return false;
  return toDateOnly(q.deadline).getTime() < toDateOnly(new Date()).getTime();
}
function isDueToday(q){
  if(!q.deadline) return false;
  return toDateOnly(q.deadline).getTime() === toDateOnly(new Date()).getTime();
}
function startOfWeek(d){
  const dt = toDateOnly(d);
  const day = dt.getDay(); // 0=Sun
  const diff = day===0 ? -6 : 1-day; // Monday start
  dt.setDate(dt.getDate()+diff);
  return dt;
}
function addDays(d,n){ const dt = new Date(d); dt.setDate(dt.getDate()+n); return dt; }
function ymd(d){ const dt=new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function daysBetween(a,b){ return Math.round((toDateOnly(b)-toDateOnly(a))/86400000); }

/* ---------------------------------------------------------
   3. QRF ID
   --------------------------------------------------------- */
function buildQrfId(code, year, num){
  code=(code||'').trim().toUpperCase();
  year=(year||'').trim();
  num=(num||'').trim();
  if(!code && !year && !num) return 'QRF-IND-__-__-___';
  return `QRF-IND-${code||'__'}-${year||'__'}-${num||'___'}`;
}
function currentYY(){ return String(new Date().getFullYear()).slice(-2); }

/* ---------------------------------------------------------
   4. PERMISSIONS  (Section 10 — the important one)
   --------------------------------------------------------- */
function isGM(u){ return u && u.role==='Full Access'; }
function isTL(u){ return u && u.role==='Team Lead'; }
function isEngineer(u){ return u && u.role==='Design Engineer'; }

function canCreateQuotation(){ return isGM(S.loggedInUser) || isTL(S.loggedInUser); }
function canEditQuotation(){ return isGM(S.loggedInUser) || isTL(S.loggedInUser); }
function canDeleteQuotation(){ return isGM(S.loggedInUser); }
function canAccessSettings(){ return isGM(S.loggedInUser); }
function canAssignEngineer(q){
  if(isGM(S.loggedInUser)) return true;
  if(isTL(S.loggedInUser)) return q.teamLead === S.loggedInUser.name;
  return false;
}
function canEditTimeLog(entry){
  if(isGM(S.loggedInUser) || isTL(S.loggedInUser)) return true;
  return entry.engineer === S.loggedInUser.name;
}
function teamLeadOptions(){
  // GM view: any user whose role is Team Lead OR Full Access (see Section 2 nuance)
  return S.users.filter(u=>u.role==='Team Lead' || u.role==='Full Access');
}
function engineersUnder(tlName){
  return S.users.filter(u=>u.role==='Design Engineer' && u.assignedTeamLead===tlName);
}

/* Scope resolution: which TL's team is "in view" right now */
function scopedTeamLead(){
  if(isEngineer(S.loggedInUser)) return null; // engineers never scope by TL, only by self
  if(isTL(S.loggedInUser)) return S.loggedInUser.name;
  if(isGM(S.loggedInUser)) return S.activeView || null; // null = full view
  return null;
}
function visibleTeamLeadChips(){
  // Only actual Team Leads appear as switchable chips (GM already sees "full view" as default)
  return S.users.filter(u=>u.role==='Team Lead');
}
function getVisibleEngineers(){
  if(isEngineer(S.loggedInUser)) return [S.loggedInUser];
  const tl = scopedTeamLead();
  if(tl) return engineersUnder(tl);
  return S.users.filter(u=>u.role==='Design Engineer');
}
function getVisibleQuotations(){
  if(isEngineer(S.loggedInUser)) return S.quotations.filter(q=>q.engineer===S.loggedInUser.name);
  const tl = scopedTeamLead();
  if(tl) return S.quotations.filter(q=>q.teamLead===tl);
  return S.quotations.slice();
}
function getVisibleLoggerNames(){
  // Everyone whose logged hours (including Other Work) belong in the current scope —
  // broader than getVisibleEngineers(), which is only Design Engineers for the
  // "one row per engineer" views (Today's Work / Weekly Timesheet).
  if(isEngineer(S.loggedInUser)) return new Set([S.loggedInUser.name]);
  const tl = scopedTeamLead();
  if(tl) return new Set([tl, ...engineersUnder(tl).map(e=>e.name)]);
  return new Set(S.users.map(u=>u.name)); // GM full view
}
function getVisibleTimelogs(){
  const visQIds = new Set(getVisibleQuotations().map(q=>q.id));
  const visLoggerNames = getVisibleLoggerNames();
  return S.timelogs.filter(t=> visLoggerNames.has(t.engineer) || (t.quotationId && visQIds.has(t.quotationId)));
}
function myLoggableQuotations(){
  // quotations a user can select in the Log Time form
  if(isEngineer(S.loggedInUser)) return S.quotations.filter(q=>q.engineer===S.loggedInUser.name && q.status!=='Completed');
  if(isTL(S.loggedInUser)) return S.quotations.filter(q=>q.teamLead===S.loggedInUser.name);
  return S.quotations.slice();
}

/* ---------------------------------------------------------
   5. DERIVED STATUS / HOURS HELPERS
   --------------------------------------------------------- */
function applyCompletionRule(q){
  if(q.status==='Sent to Sales' && q.estimationSent && q.drawingSent){
    q.status='Completed';
    q.completedDate = q.completedDate || todayStr();
  }
  return q;
}
function hoursFor(quotationId){
  return S.timelogs.filter(t=>t.quotationId===quotationId).reduce((a,t)=>a+(parseFloat(t.hours)||0),0);
}
function hoursForEngineerOnDate(name,date){
  return S.timelogs.filter(t=>t.engineer===name && t.date===date).reduce((a,t)=>a+(parseFloat(t.hours)||0),0);
}
function statusClass(s){ return 'badge-'+s.replace(/[^A-Za-z]/g,''); }
function pendingTLCount(){
  const tl = scopedTeamLead();
  const qs = tl ? S.quotations.filter(q=>q.teamLead===tl) : (isEngineer(S.loggedInUser)?[]:S.quotations);
  return qs.filter(q=>q.status==='Assigned to TL').length;
}

/* ---------------------------------------------------------
   7. PERSISTENCE (local cache) + API
   --------------------------------------------------------- */
function saveCache(){
  localStorage.setItem('ih_cache_v1', JSON.stringify({users:S.users, quotations:S.quotations, timelogs:S.timelogs, tasks:S.tasks}));
}
function loadCache(){
  try{
    const raw = localStorage.getItem('ih_cache_v1');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}

const api = {
  async getUsers(){
    if(!CONFIG.APPS_SCRIPT_URL) throw new Error('no-backend');
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=getUsers`);
    if(!res.ok) throw new Error('bad-response');
    return res.json();
  },
  async getAll(){
    if(!CONFIG.APPS_SCRIPT_URL) throw new Error('no-backend');
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=getAll`);
    if(!res.ok) throw new Error('bad-response');
    return res.json();
  },
  async post(action, payload){
    if(!CONFIG.APPS_SCRIPT_URL) return {ok:false, offline:true};
    try{
      const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight against Apps Script
        body: JSON.stringify({action, payload})
      });
      return await res.json();
    }catch(e){
      return {ok:false, error:String(e)};
    }
  }
};

/* ---------------------------------------------------------
   8. SYNC ENGINE
   --------------------------------------------------------- */
let pollTimer=null;
async function fullSync(showToast){
  setSyncStatus('syncing');
  try{
    const data = await api.getAll();
    if(data && (data.users || data.quotations || data.timelogs)){
      S.users = data.users || S.users;
      S.quotations = (data.quotations || S.quotations).map(applyCompletionRule);
      S.timelogs = data.timelogs || S.timelogs;
      S.tasks = data.tasks || S.tasks;
      saveCache();
      S.lastSyncAt = new Date();
      setSyncStatus('ok');
      if(showToast) toast('Synced with the shared sheet.', 'ok');
      renderApp();
    } else {
      setSyncStatus('stale');
    }
  }catch(e){
    setSyncStatus('off');
    if(showToast) toast('Could not reach the backend — working from local data.', 'err');
  }
}
function setSyncStatus(s){ S.syncStatus=s; renderTopbarSyncOnly(); }
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>fullSync(false), CONFIG.POLL_MS);
}

/* ---------------------------------------------------------
   9. TOASTS
   --------------------------------------------------------- */
function toast(msg, type){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast'+(type==='err'?' err':type==='ok'?' ok':'');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ---------------------------------------------------------
   10. THEME
   --------------------------------------------------------- */
function applyTheme(id){
  const t = THEMES.find(x=>x.id===id) || THEMES[0];
  const root = document.documentElement.style;
  root.setProperty('--steel-800', t.sidebar);
  root.setProperty('--steel-900', shade(t.sidebar,-12));
  root.setProperty('--steel-700', shade(t.sidebar,14));
  root.setProperty('--accent', t.accent);
  root.setProperty('--accent-2', t.accent2);
  root.setProperty('--bg', t.bg);
  S.theme = id;
  localStorage.setItem('ih_theme_v1', id);
}
function shade(hex, pct){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=Math.min(255,Math.max(0,r+Math.round(255*pct/100)));
  g=Math.min(255,Math.max(0,g+Math.round(255*pct/100)));
  b=Math.min(255,Math.max(0,b+Math.round(255*pct/100)));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* ---------------------------------------------------------
   11. INIT
   --------------------------------------------------------- */
async function init(){
  applyTheme(S.theme);
  const cached = loadCache();
  if(cached){ S.users=cached.users||[]; S.quotations=(cached.quotations||[]).map(applyCompletionRule); S.timelogs=cached.timelogs||[]; S.tasks=cached.tasks||[]; }
  if(!S.users.length){
    const seed = seedData();
    S.users=seed.users; S.quotations=seed.quotations; S.timelogs=seed.timelogs; S.tasks=seed.tasks;
    saveCache();
  }
  // try to get the live roster before showing login (Section 2 requirement)
  try{
    const u = await api.getUsers();
    if(u && u.users && u.users.length){ S.users = u.users; saveCache(); setSyncStatus('ok'); }
  }catch(e){ setSyncStatus(CONFIG.APPS_SCRIPT_URL ? 'off' : 'off'); }

  const savedSession = localStorage.getItem('ih_session_v1');
  if(savedSession){
    const u = S.users.find(x=>x.name===savedSession);
    if(u){ S.loggedInUser = u; }
  }

  if(S.loggedInUser){
    await fullSync(false);
    showApp();
  } else {
    renderLogin();
  }
}
window.addEventListener('DOMContentLoaded', init);

    ? S.users.filter(u=>u.name.toLowerCase().includes(S.loginName.trim().toLowerCase()))

        </div>
        ${S.loginStep==='name' ? `
          <div class="form-row">
            <label>Your name</label>
            <input type="text" id="loginNameInput" placeholder="Start typing your name…" value="${escAttr(S.loginName)}" autocomplete="off">
            ${matches.length ? `<div class="name-suggest">${matches.map(m=>`<div class="opt" data-action="pick-login-name" data-name="${escAttr(m.name)}">${esc(m.name)} <span style="color:var(--ink-soft);font-size:11px;">— ${esc(m.role)}</span></div>`).join('')}</div>` : ''}
          </div>
          <button class="btn btn-primary" style="width:100%;justify-content:center;" data-action="login-continue">Continue</button>
          ${S.loginErr ? `<div class="login-err">${esc(S.loginErr)}</div>` : ''}
        ` : `
          <div class="form-row">
            <label>Welcome, ${esc(S.loginName)} — enter your 4-digit PIN</label>
            <input type="password" inputmode="numeric" maxlength="4" class="pin-input" id="loginPinInput" placeholder="••••" value="${escAttr(S.loginPin)}">
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn" data-action="login-back" style="flex:0 0 auto;">Back</button>
            <button class="btn btn-primary" style="flex:1;justify-content:center;" data-action="login-submit">Log in</button>
          </div>
          ${S.loginErr ? `<div class="login-err">${esc(S.loginErr)}</div>` : ''}
        `}
        <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-soft);">
          ${S.syncStatus==='ok' ? 'Connected to the shared roster.' : CONFIG.APPS_SCRIPT_URL ? 'Could not reach the backend — showing locally cached team.' : 'Demo mode: no Apps Script URL configured yet.'}
        </div>
      </div>
    </div>`;
  const nameInput = document.getElementById('loginNameInput');
  if(nameInput){ nameInput.focus(); nameInput.oninput = (e)=>{ S.loginName = e.target.value; renderLogin(); }; }
  const pinInput = document.getElementById('loginPinInput');
  if(pinInput){
    pinInput.focus();
    pinInput.oninput = (e)=>{ S.loginPin = e.target.value.replace(/\D/g,'').slice(0,4); e.target.value = S.loginPin; };
    pinInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') attemptLogin(); });
  }
}
function loginContinue(){
  const name = S.loginName.trim();
  if(!name){ S.loginErr='Enter your name to continue.'; renderLogin(); return; }
  const match = S.users.find(u=>u.name.toLowerCase()===name.toLowerCase());
  if(!match){ S.loginErr='No team member found with that name. Check spelling or ask your GM to add you in Settings.'; renderLogin(); return; }
  S.loginName = match.name;
  S.loginStep='pin'; S.loginErr=''; S.loginPin='';
  renderLogin();
}
function attemptLogin(){
  const user = S.users.find(u=>u.name===S.loginName);
  if(!user){ S.loginErr='Something went wrong — try again.'; renderLogin(); return; }
  if(String(user.pin)!==String(S.loginPin)){
    S.loginErr='Incorrect PIN.'; S.loginPin=''; renderLogin(); return;
  }
  S.loggedInUser = user;
  S.activeView = null;
  localStorage.setItem('ih_session_v1', user.name);
  S.loginStep='name'; S.loginName=''; S.loginPin=''; S.loginErr='';
  fullSync(false);
  showApp();
}
function logout(){
  S.loggedInUser=null; S.activeView=null;
  localStorage.removeItem('ih_session_v1');
  if(pollTimer) clearInterval(pollTimer);
  document.getElementById('app').classList.remove('ready');
  renderLogin();
}

/* ---------------------------------------------------------
   13. SMALL HELPERS
   --------------------------------------------------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }
function initialsOf(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase();
}
function colourFor(name){
  const u = S.users.find(x=>x.name===name);
  if(u && u.colour) return u.colour;
  let hash=0; for(let i=0;i<(name||'').length;i++) hash = name.charCodeAt(i)+((hash<<5)-hash);
  const palette=['#ff7a29','#2ec4b6','#5b8def','#8e5bef','#f2b705','#e5484d','#7cb342'];
  return palette[Math.abs(hash)%palette.length];
}
function statusLabel(s){ return s; }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

/* ---------------------------------------------------------
   23. SINGLE DELEGATED CLICK HANDLER  (known bug #4 / #5 fix)
   Every dynamically-rendered clickable element carries a
   data-action (+ data-* payload) instead of inline onclick,
   so free-text values with apostrophes/quotes can never break
   a handler. closest('[data-action]') also means a click deep
   inside the modal never gets mis-routed to the overlay's
   close action, without ever needing stopPropagation.
   --------------------------------------------------------- */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case 'nav':
      S.page = el.dataset.page; S.sidebarOpen=false; renderApp(); break;
    case 'logout':
      logout(); break;
    case 'toggle-sidebar':
      S.sidebarOpen = !S.sidebarOpen; renderSidebar(); document.getElementById('mobileOverlay').classList.toggle('open', S.sidebarOpen); break;
    case 'manual-sync':
      fullSync(true); break;
    case 'preview-tl':
      S.activeView = el.dataset.name || null; renderApp(); break;

    case 'pick-login-name':
      S.loginName = el.dataset.name; loginContinue(); break;
    case 'login-continue':
      loginContinue(); break;
    case 'login-back':
      S.loginStep='name'; S.loginErr=''; renderLogin(); break;
    case 'login-submit':
      attemptLogin(); break;

    case 'new-quotation':
      openNewQuotationModal(); break;
    case 'edit-quotation':{
      const q = S.quotations.find(x=>x.id===el.dataset.id);
      if(q) openEditQuotationModal(q);
      break;}
    case 'delete-quotation':
      deleteQuotationConfirm(el.dataset.id); break;
    case 'open-quotation':
      openQuotationDetail(el.dataset.id); break;
    case 'q-view':
      S.quotationsView = el.dataset.view; renderPage(); break;
    case 'filter-status':
      S.filters.status = el.dataset.status || null; renderPage(); break;
    case 'filter-status-goto':
      S.filters.status = el.dataset.status || null; S.page='quotations'; S.quotationsView='list'; renderApp(); break;

    case 'close-modal':
      closeModal(); break;
    case 'modal-overlay':
      if(e.target === el) closeModal();
      break;

    case 'save-quotation':
      saveQuotationFromForm(); break;
    case 'assign-engineer':
      assignEngineerToSelected(el.dataset.id); break;
    case 'hold-quotation':
      holdQuotation(el.dataset.id); break;
    case 'resume-quotation':
      resumeQuotation(el.dataset.id); break;
    case 'move-status':
      moveStatus(el.dataset.id, el.dataset.status); break;
    case 'reopen-quotation':
      reopenQuotation(el.dataset.id); break;

    case 'log-time-for':
      openLogTimeModal(el.dataset.id); break;
    case 'log-time-general':
      openLogTimeModal(null); break;
    case 'edit-timelog':
      openEditTimeLogModal(el.dataset.id); break;
    case 'pick-worktype':
      pickWorkType(el.dataset.wt); break;
    case 'save-timelog':
      saveTimeLogFromForm(); break;

    case 'tlog-tab':
      S.timelogTab = el.dataset.tab; renderPage(); break;
    case 'week-prev':
      S.weekStart = addDays(S.weekStart, -7); renderPage(); break;
    case 'week-next':
      S.weekStart = addDays(S.weekStart, 7); renderPage(); break;
    case 'week-today':
      S.weekStart = startOfWeek(new Date()); renderPage(); break;

    case 'new-user':
      openUserFormModal(null); break;
    case 'edit-user':
      openUserFormModal(el.dataset.name); break;
    case 'reset-pin':
      resetUserPin(el.dataset.name); break;
    case 'delete-user':
      deleteUserConfirm(el.dataset.name); break;
    case 'save-user':
      saveUserFromForm(); break;
    case 'pick-theme':
      pickTheme(el.dataset.id); break;
  }
});

function renderDashboard(){
  const qs = getVisibleQuotations();
  const engineers = getVisibleEngineers();

  // "Who is working on what" — first, most important thing on the page
  const whoCards = engineers.map(eng=>{
    const active = qs.filter(q=>q.engineer===eng.name && q.status!=='Completed');
    const rows = active.length ? active.map(q=>`
      <div class="who-row">
        <span class="qid mono" style="font-size:12.5px;">${esc(q.qrfId)}<span class="rev-tag">Rev ${esc(q.revisionNumber||'0')}</span></span>
        <span class="badge ${statusClass(q.status)}" style="font-size:10px;padding:2px 8px;">${esc(q.status)}</span>
        ${isDelayed(q)?'<span class="badge badge-delayed" style="font-size:10px;padding:2px 8px;">Late</span>':''}
        <span class="hrs">${hoursFor(q.id).toFixed(1)}h</span>
      </div>`).join('') : `<div class="empty-note">No active quotations right now.</div>`;
    return `<div class="who-card">
      <div class="head">
        <div class="avatar" style="background:${colourFor(eng.name)}">${initialsOf(eng.name)}</div>
        <div><div class="n">${esc(eng.name)}</div><div class="role">${active.length} active</div></div>
      </div>
      ${rows}
    </div>`;
  }).join('') || `<div class="empty-state">No engineers in view yet.</div>`;

  // Pipeline strip
  const pipeCounts = STATUS_LIST.map(s=>qs.filter(q=>q.status===s).length);
  const pipeHtml = STATUS_LIST.map((s,i)=>`
    <div class="pipe-step ${S.filters.status===s?'selected':''}" data-action="filter-status-goto" data-status="${esc(s)}">
      <div class="n">${pipeCounts[i]}</div>
      <div class="l">${esc(s)}</div>
    </div>`).join('');

  // Alerts
  const delayedCount = qs.filter(isDelayed).length;
  const onHoldCount = qs.filter(q=>q.status==='On Hold').length;
  const pendingCount = qs.filter(q=>q.status==='Assigned to TL').length;

  // Active table sorted by nearest deadline
  const active = qs.filter(q=>q.status!=='Completed' && q.deadline)
    .sort((a,b)=> new Date(a.deadline) - new Date(b.deadline));
  const noDeadline = qs.filter(q=>q.status!=='Completed' && !q.deadline);
  const activeRows = [...active, ...noDeadline];

  const tableRows = activeRows.slice(0,25).map(q=>`
    <tr class="clickable ${isDelayed(q)?'row-delayed':''}" data-action="open-quotation" data-id="${q.id}">
      <td><span class="qid">${esc(q.qrfId)}</span><span class="rev-tag">Rev ${esc(q.revisionNumber||'0')}</span></td>
      <td>${esc(q.clientName)}</td>
      <td><span class="badge ${statusClass(q.status)}">${esc(q.status)}</span></td>
      <td>${esc(q.engineer||'—')}</td>
      <td>${formatDate(q.deadline)} ${isDelayed(q)?'<span class="badge badge-delayed" style="margin-left:4px;">Delayed</span>':isDueToday(q)?'<span class="badge badge-outline" style="margin-left:4px;">Due today</span>':''}</td>
      <td>${hoursFor(q.id).toFixed(1)}h</td>
    </tr>`).join('') || `<tr><td colspan="6" class="empty-state">Nothing active in view.</td></tr>`;

  // Hours by work type
  const visLogs = getVisibleTimelogs();
  const byType = WORK_TYPES.map(wt=>({wt, hrs: visLogs.filter(l=>l.workType===wt).reduce((a,l)=>a+(parseFloat(l.hours)||0),0)}));

  return `
    <div class="section-head"><h2>Who's working on what</h2></div>
    <div class="grid grid-3">${whoCards}</div>

    <div class="section-head"><h2>Pipeline</h2></div>
    <div class="pipeline-strip">${pipeHtml}</div>

    <div class="section-head"><h2>Alerts</h2></div>
    <div class="grid grid-3">
      <div class="alert-tile danger" data-action="filter-status-goto" data-status="__delayed">
        <div><div style="font-size:12px;color:var(--ink-soft);font-weight:600;">Delayed</div><div class="num">${delayedCount}</div></div>
        <div style="font-size:20px;">&#9888;</div>
      </div>
      <div class="alert-tile warning" data-action="filter-status-goto" data-status="On Hold">
        <div><div style="font-size:12px;color:var(--ink-soft);font-weight:600;">On Hold</div><div class="num">${onHoldCount}</div></div>
        <div style="font-size:20px;">&#9209;</div>
      </div>
      <div class="alert-tile info" data-action="filter-status-goto" data-status="Assigned to TL">
        <div><div style="font-size:12px;color:var(--ink-soft);font-weight:600;">Pending TL assignment</div><div class="num">${pendingCount}</div></div>
        <div style="font-size:20px;">&#128101;</div>
      </div>
    </div>

    <div class="section-head"><h2>Active quotations</h2><span class="count">${activeRows.length}</span></div>
    <div class="card table-wrap">
      <table>
        <thead><tr><th>QRF ID</th><th>Client</th><th>Status</th><th>Engineer</th><th>Deadline</th><th>Hours</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>

    <div class="section-head"><h2>Hours by work type</h2></div>
    <div class="grid grid-4">
      ${byType.map(x=>`<div class="card card-pad"><div style="font-size:11px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.03em;">${esc(x.wt)}</div><div class="mono" style="font-size:22px;font-weight:700;margin-top:4px;">${x.hrs.toFixed(1)}h</div></div>`).join('')}
    </div>
  `;
}

function filteredQuotations(){
  let qs = getVisibleQuotations();
  if(S.filters.status==='__delayed') qs = qs.filter(isDelayed);
  else if(S.filters.status) qs = qs.filter(q=>q.status===S.filters.status);
  if(S.filters.search.trim()){
    const t = S.filters.search.trim().toLowerCase();
    qs = qs.filter(q=> (q.qrfId||'').toLowerCase().includes(t) || (q.clientName||'').toLowerCase().includes(t) || (q.engineer||'').toLowerCase().includes(t));
  }
  return qs.sort((a,b)=> new Date(b.dateReceived||0) - new Date(a.dateReceived||0));
}

function renderQuotationsPage(){
  const qs = filteredQuotations();
  const filterChips = ['All', ...STATUS_LIST];

  return `
    <div class="filter-bar">
      <input class="search-input" placeholder="Search QRF ID, client, engineer…" id="qSearchInput" value="${escAttr(S.filters.search)}">

      <div class="spacer" style="flex:1;"></div>

      <div class="chip-filter ${S.quotationsView==='kanban'?'active':''}" data-action="q-view" data-view="kanban">Kanban</div>

      <button class="btn" data-action="close-modal">Cancel</button>
      <button class="btn btn-primary" data-action="save-quotation">Save Quotation</button>
    </div>`;
  openModal(html);
  bindQFormInputs();
}
function bindQFormInputs(){
  const f = S.qForm;
  const map = {'f-code':'qrfSalesCode','f-year':'qrfYear','f-num':'qrfNumber','f-client':'clientName','f-consultant':'consultantName','f-received':'dateReceived','f-deadline':'deadline','f-rev':'revisionNumber','f-notes':'notes'};
  Object.keys(map).forEach(elId=>{
    const el = document.getElementById(elId);
    if(!el) return;
    el.oninput = (e)=>{
      f[map[elId]] = e.target.value;
      if(['f-code','f-year','f-num'].includes(elId)){
        const preview = document.querySelector('.qid-preview');
        if(preview) preview.textContent = buildQrfId(f.qrfSalesCode, f.qrfYear, f.qrfNumber);
      }
    };
  });
  const tlSel = document.getElementById('f-tl');
  if(tlSel) tlSel.onchange = (e)=>{ f.teamLead = e.target.value; f.engineer=''; renderQuotationFormModal(); };
  const engSel = document.getElementById('f-eng');
  if(engSel) engSel.onchange = (e)=>{ f.engineer = e.target.value; };
}
function validateQuotationForm(){
  const f = S.qForm; f.errors={};
  if(!f.qrfSalesCode.trim() || !f.qrfYear.trim() || !f.qrfNumber.trim()) f.errors.qrf='All three QRF ID parts are required.';
  if(!f.clientName.trim()) f.errors.clientName='Client name is required.';
  if(!f.teamLead) f.errors.teamLead='Choose a Team Lead.';
  if(f.revisionNumber===undefined || f.revisionNumber===null || String(f.revisionNumber).trim()==='') f.errors.revisionNumber='Type a revision number (e.g. 0).';
  return Object.keys(f.errors).length===0;
}
function saveQuotationFromForm(){
  if(!validateQuotationForm()){ renderQuotationFormModal(); return; }
  const f = S.qForm;
  const qrfId = buildQrfId(f.qrfSalesCode, f.qrfYear, f.qrfNumber);
  if(f.mode==='new'){
    const status = f.engineer ? 'In Progress' : 'Assigned to TL';
    const q = {
      id: uid('q'), qrfSalesCode:f.qrfSalesCode.trim().toUpperCase(), qrfYear:f.qrfYear.trim(), qrfNumber:f.qrfNumber.trim(), qrfId,
      clientName:f.clientName.trim(), consultantName:f.consultantName.trim(), teamLead:f.teamLead, engineer:f.engineer,
      dateReceived:f.dateReceived, deadline:f.deadline, status,
      revisionNumber:String(f.revisionNumber).trim(), holdReason:'', holdStart:'', holdEnd:'',
      estimationSent:false, drawingSent:false, sentToSalesDate:'', completedDate:'', notes:f.notes.trim()
    };
    // (a) update in-memory model immediately, (b) close modal, (c) navigate, (d) fire sync — bug #9 order
    S.quotations.unshift(q);
    saveCache();
    closeModal();
    S.page='quotations'; S.filters.status=null; S.filters.search='';
    renderApp();
    toast('Quotation created.', 'ok');
    api.post('saveQuotation', q).then(r=>{ if(r && r.ok===false && !r.offline) toast('Saved locally — will retry syncing to the sheet.', 'err'); });
  } else {
    const q = S.quotations.find(x=>x.id===f.id);
    if(!q) return;
    q.qrfSalesCode=f.qrfSalesCode.trim().toUpperCase(); q.qrfYear=f.qrfYear.trim(); q.qrfNumber=f.qrfNumber.trim();
    q.qrfId = qrfId;
    q.clientName=f.clientName.trim(); q.consultantName=f.consultantName.trim();
    q.teamLead=f.teamLead; q.engineer=f.engineer;
    q.dateReceived=f.dateReceived; q.deadline=f.deadline;
    q.revisionNumber=String(f.revisionNumber).trim(); q.notes=f.notes.trim();
    saveCache();
    closeModal();
    renderApp();
    toast('Quotation updated.', 'ok');
    api.post('updateQuotation', q).then(r=>{ if(r && r.ok===false && !r.offline) toast('Saved locally — will retry syncing to the sheet.', 'err'); });
  }
}

function openQuotationDetail(id){
  const q = S.quotations.find(x=>x.id===id);
  if(!q) return;
  renderQuotationDetailModal(q);
}
function renderQuotationDetailModal(q){
  const logs = S.timelogs.filter(t=>t.quotationId===q.id).sort((a,b)=> new Date(b.date)-new Date(a.date));
  const totalHrs = hoursFor(q.id);
  const canEdit = canEditQuotation();
  const canDelete = canDeleteQuotation();
  const canAssign = canAssignEngineer(q);
  const isMine = q.engineer === S.loggedInUser.name;
  const engOptions = engineersUnder(q.teamLead);

  let actionZone = '';

  if(q.status==='On Hold'){
    actionZone += `<div class="hold-banner"><strong>On hold:</strong> ${esc(q.holdReason||'No reason given.')}<br><span style="font-size:11px;">Since ${formatDate(q.holdStart)}</span></div>`;
    if(canEdit) actionZone += `<button class="btn btn-primary" data-action="resume-quotation" data-id="${q.id}">Resume</button>`;
  }

  if(q.status==='Assigned to TL'){
    if(canAssign){
      actionZone += `<div class="form-row"><label>Assign Engineer</label>
        <div style="display:flex;gap:8px;">
          <select id="assignEngSelect" style="flex:1;">
            <option value="">Select an engineer…</option>
            ${engOptions.map(e=>`<option value="${escAttr(e.name)}">${esc(e.name)}</option>`).join('')}
          </select>
          <button class="btn btn-primary" data-action="assign-engineer" data-id="${q.id}">Assign</button>
        </div></div>`;
    } else {
      actionZone += `<div class="empty-note">Waiting for ${esc(q.teamLead)} to assign an engineer.</div>`;
    }
  }

  if(q.status==='In Progress'){
    actionZone += `<div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" data-action="hold-quotation" data-id="${q.id}">Put On Hold</button>
      ${canEdit ? `<button class="btn btn-primary" data-action="move-status" data-id="${q.id}" data-status="Under Checking">Send to Under Checking</button>` : ''}
    </div>`;
  }

  if(q.status==='Under Checking'){
    if(canEdit || isMine) actionZone += `<button class="btn btn-primary" data-action="move-status" data-id="${q.id}" data-status="Sent to Sales">Move to Sent to Sales</button>`;
  }

  if(q.status==='Sent to Sales'){
    actionZone += `
      <div class="checkbox-row"><input type="checkbox" id="chkEstimation" ${q.estimationSent?'checked':''}> <label for="chkEstimation" style="margin:0;">Estimation sent</label></div>
      <div class="checkbox-row"><input type="checkbox" id="chkDrawing" ${q.drawingSent?'checked':''}> <label for="chkDrawing" style="margin:0;">Proposal Drawing sent</label></div>
      <div class="hint">Ticking both automatically marks this Completed.</div>
    `;
  }

  if(q.status==='Completed'){
    actionZone += `<div style="font-size:13px;color:var(--success);font-weight:700;margin-bottom:10px;">&#10003; Completed ${q.completedDate?('on '+formatDate(q.completedDate)):''}</div>`;
    if(canEdit) actionZone += `<button class="btn btn-primary" data-action="reopen-quotation" data-id="${q.id}">Reopen for Revision</button>`;
  }

  const logRows = logs.slice(0,8).map(l=>`
    <tr class="clickable" data-action="edit-timelog" data-id="${l.id}">
      <td>${formatDate(l.date)}</td>
      <td><span class="wdot wdot-${l.workType.replace(/\s+/g,'')}"></span> ${esc(l.workType)}</td>
      <td>${esc(l.engineer)}</td>
      <td class="mono">${parseFloat(l.hours).toFixed(1)}h</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(l.remarks)}</td>
    </tr>`).join('') || `<tr><td colspan="5" class="empty-note">No time logged yet.</td></tr>`;

  const html = `
    <div class="modal-head">
      <div>
        <div class="qid qid-lg">${esc(q.qrfId)}<span class="rev-tag">Rev ${esc(q.revisionNumber||'0')}</span></div>
      </div>
      <button class="modal-close" data-action="close-modal">&times;</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <span class="badge ${statusClass(q.status)}">${esc(q.status)}</span>
        ${isDelayed(q)?'<span class="badge badge-delayed">Delayed</span>':''}
        ${isDueToday(q)?'<span class="badge badge-outline">Due today</span>':''}
      </div>

      <div class="detail-grid">
        <div>
          <div class="kv"><span class="k">Client</span><span class="v">${esc(q.clientName)}</span></div>
          ${q.consultantName?`<div class="kv"><span class="k">Consultant</span><span class="v">${esc(q.consultantName)}</span></div>`:''}
          <div class="kv"><span class="k">Team Lead</span><span class="v">${esc(q.teamLead)}</span></div>
          <div class="kv"><span class="k">Engineer</span><span class="v">${esc(q.engineer||'Unassigned')}</span></div>

      <button class="btn" data-action="close-modal">Close</button>
    </div>`;
  openModal(html, true);

  const ce = document.getElementById('chkEstimation');
  const cd = document.getElementById('chkDrawing');
  if(ce) ce.onchange = ()=> toggleSentCheckbox(q.id, 'estimationSent', ce.checked);
  if(cd) cd.onchange = ()=> toggleSentCheckbox(q.id, 'drawingSent', cd.checked);
}

function pushQuotationUpdate(q, action){
  saveCache();
  api.post(action||'updateQuotation', q).then(r=>{ if(r && r.ok===false && !r.offline) toast('Saved locally — will retry syncing.', 'err'); });
}

function assignEngineerToSelected(qid){
  const sel = document.getElementById('assignEngSelect');
  if(!sel || !sel.value){ toast('Choose an engineer first.', 'err'); return; }
  const q = S.quotations.find(x=>x.id===qid); if(!q) return;
  q.engineer = sel.value;
  q.status = 'In Progress';
  pushQuotationUpdate(q);
  renderApp(); openQuotationDetail(qid);
  toast(`Assigned to ${sel.value}.`, 'ok');
}
function holdQuotation(qid){
  const q = S.quotations.find(x=>x.id===qid); if(!q) return;
  const reason = prompt('Why is this quotation going on hold?');
  if(reason===null) return;
  q.status='On Hold'; q.holdReason=reason.trim(); q.holdStart=todayStr(); q.holdEnd='';
  pushQuotationUpdate(q);
  renderApp(); openQuotationDetail(qid);
  toast('Marked On Hold.', 'ok');
}
function resumeQuotation(qid){
  const q = S.quotations.find(x=>x.id===qid); if(!q) return;
  q.status='In Progress'; q.holdEnd=todayStr();
  pushQuotationUpdate(q);
  renderApp(); openQuotationDetail(qid);
  toast('Resumed.', 'ok');
}
function moveStatus(qid, status){
  const q = S.quotations.find(x=>x.id===qid); if(!q) return;
  q.status = status;
  if(status==='Sent to Sales' && !q.sentToSalesDate) q.sentToSalesDate = todayStr();
  applyCompletionRule(q);
  pushQuotationUpdate(q);
  renderApp(); openQuotationDetail(qid);
  toast(`Moved to ${status}.`, 'ok');
}
function toggleSentCheckbox(qid, field, val){
  const q = S.quotations.find(x=>x.id===qid); if(!q) return;
  q[field]=val;
  applyCompletionRule(q);
  pushQuotationUpdate(q);
  renderApp();
  if(document.querySelector('.overlay')) openQuotationDetail(qid);
  if(q.status==='Completed') toast('Both items sent — marked Completed.', 'ok');
}
function reopenQuotation(qid){
  const q = S.quotations.find(x=>x.id===qid); if(!q) return;
  const newRev = prompt(`Reopening ${q.qrfId} for a revision.\nEnter the new revision number:`, '');
  if(newRev===null || newRev.trim()===''){ toast('Revision number is required to reopen.', 'err'); return; }
  q.revisionNumber = newRev.trim();
  q.status = 'In Progress';
  q.estimationSent=false; q.drawingSent=false; q.sentToSalesDate=''; q.completedDate='';
  pushQuotationUpdate(q);
  renderApp(); openQuotationDetail(qid);
  toast(`Reopened as Rev ${newRev.trim()}.`, 'ok');
}
function deleteQuotationConfirm(qid){
  const q = S.quotations.find(x=>x.id===qid); if(!q) return;
  if(!confirm(`Delete ${q.qrfId} and all of its time log entries? This can't be undone.`)) return;
  S.quotations = S.quotations.filter(x=>x.id!==qid);
  S.timelogs = S.timelogs.filter(t=>t.quotationId!==qid);
  saveCache();
  closeModal();
  renderApp();
  toast('Quotation deleted.', 'ok');
  api.post('deleteQuotation', {id:qid}).then(r=>{ if(r && r.ok===false && !r.offline) toast('Deleted locally — will retry syncing.', 'err'); });
}

function renderTimelogPage(){
  const tabs = [
    {id:'today', label:"Today's Work"},
    {id:'byquotation', label:'By Quotation'},
    {id:'weekly', label:'Weekly Timesheet'},
    {id:'all', label:'All Entries'}
  ];
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px;">
      <div class="tabs" style="margin-bottom:0;border-bottom:none;">
        ${tabs.map(t=>`<div class="tab-btn ${S.timelogTab===t.id?'active':''}" data-action="tlog-tab" data-tab="${t.id}">${t.label}</div>`).join('')}
      </div>
      <button class="btn btn-primary" data-action="log-time-general">+ Log Time</button>
    </div>
    <div class="tabs" style="margin-top:0;"></div>
    ${S.timelogTab==='today' ? renderTodaysWork() : ''}
    ${S.timelogTab==='byquotation' ? renderByQuotation() : ''}
    ${S.timelogTab==='weekly' ? renderWeeklyTimesheet() : ''}
    ${S.timelogTab==='all' ? renderAllEntries() : ''}
  `;
}

function renderTodaysWork(){
  const engineers = getVisibleEngineers();
  const t = todayStr();
  const cards = engineers.map(e=>{
    const entries = S.timelogs.filter(l=>l.engineer===e.name && l.date===t);
    const total = entries.reduce((a,l)=>a+(parseFloat(l.hours)||0),0);
    const rows = entries.length ? entries.map(l=>{
      const q = S.quotations.find(x=>x.id===l.quotationId);
      return `<div class="who-row clickable" data-action="edit-timelog" data-id="${l.id}">
        <span class="wdot wdot-${l.workType.replace(/\s+/g,'')}"></span>
        <span class="qid" style="font-size:12px;flex:1;">${q?esc(q.qrfId):'Other Work'}</span>
        <span class="hrs">${parseFloat(l.hours).toFixed(1)}h</span>
      </div>`;
    }).join('') : `<div class="empty-note">No work logged today.</div>`;
    return `<div class="who-card">
      <div class="head">
        <div class="avatar" style="background:${colourFor(e.name)}">${initialsOf(e.name)}</div>
        <div><div class="n">${esc(e.name)}</div><div class="role">${total.toFixed(1)}h today</div></div>
      </div>
      ${rows}
    </div>`;
  }).join('') || `<div class="empty-state">No engineers in view.</div>`;
  return `<div class="grid grid-3">${cards}</div>`;
}

function renderByQuotation(){
  const qs = getVisibleQuotations();
  if(!qs.length) return `<div class="empty-state">No quotations in view.</div>`;
  const rows = qs.map(q=>{
    const logs = S.timelogs.filter(l=>l.quotationId===q.id);
    const total = logs.reduce((a,l)=>a+(parseFloat(l.hours)||0),0);
    if(!logs.length && S.filters.search) return '';
    const byEng = {};
    logs.forEach(l=>{ byEng[l.engineer]=(byEng[l.engineer]||0)+parseFloat(l.hours||0); });
    const byType = {};
    logs.forEach(l=>{ byType[l.workType]=(byType[l.workType]||0)+parseFloat(l.hours||0); });
    const engStr = Object.keys(byEng).map(n=>`${n}: ${byEng[n].toFixed(1)}h`).join(' · ') || '—';
    const typeStr = Object.keys(byType).map(n=>`${n} ${byType[n].toFixed(1)}h`).join(' · ') || '—';
    return `<tr>
      <td><span class="qid">${esc(q.qrfId)}</span><span class="rev-tag">Rev ${esc(q.revisionNumber||'0')}</span></td>
      <td>${esc(q.clientName)}</td>
      <td class="mono">${total.toFixed(1)}h</td>
      <td style="font-size:12px;">${esc(engStr)}</td>
      <td style="font-size:12px;">${esc(typeStr)}</td>
    </tr>`;
  }).join('');
  return `<div class="card table-wrap"><table>
    <thead><tr><th>QRF ID</th><th>Client</th><th>Total</th><th>By engineer</th><th>By work type</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderWeeklyTimesheet(){
  const engineers = getVisibleEngineers();
  const start = S.weekStart;
  const days = [0,1,2,3,4,5,6].map(i=>addDays(start,i));
  const dayLabels = days.map(d=>d.toLocaleDateString('en-GB',{weekday:'short', day:'2-digit'}));
  const rangeLabel = `${formatDate(days[0])} – ${formatDate(days[6])}`;

  const rows = engineers.map(e=>{
    const cells = days.map(d=>{
      const dstr = ymd(d);
      const entries = S.timelogs.filter(l=>l.engineer===e.name && l.date===dstr);
      const total = entries.reduce((a,l)=>a+(parseFloat(l.hours)||0),0);
      const types = [...new Set(entries.map(l=>l.workType))];
      return `<td class="daycell">
        ${total>0?`<div class="daytotal">${total.toFixed(1)}</div>`:'<div style="color:var(--line);">–</div>'}
        <div class="dots">${types.map(t=>`<span class="wdot wdot-${t.replace(/\s+/g,'')}"></span>`).join('')}</div>
      </td>`;
    }).join('');
    const weekTotal = days.reduce((a,d)=>a+hoursForEngineerOnDate(e.name, ymd(d)),0);
    return `<tr><td><div style="display:flex;align-items:center;gap:6px;"><div class="avatar" style="width:22px;height:22px;font-size:9px;background:${colourFor(e.name)}">${initialsOf(e.name)}</div>${esc(e.name)}</div></td>${cells}<td class="mono" style="font-weight:700;">${weekTotal.toFixed(1)}</td></tr>`;
  }).join('');

  const teamTotals = days.map(d=>{
    const dstr = ymd(d);
    return engineers.reduce((a,e)=>a+hoursForEngineerOnDate(e.name,dstr),0);
  });
  const grandTotal = teamTotals.reduce((a,b)=>a+b,0);

  return `
    <div class="week-nav">
      <button class="btn btn-sm" data-action="week-prev">&larr; Prev</button>
      <div class="lbl">${rangeLabel}</div>
      <button class="btn btn-sm" data-action="week-next">Next &rarr;</button>
      <button class="btn btn-sm btn-ghost" data-action="week-today">This week</button>
    </div>
    <div class="card table-wrap tsheet"><table>
      <thead><tr><th>Engineer</th>${dayLabels.map(l=>`<th>${l}</th>`).join('')}<th>Total</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="9" class="empty-state">No engineers in view.</td></tr>`}</tbody>
      <tfoot><tr class="totrow"><td>Team total</td>${teamTotals.map(t=>`<td class="daycell mono">${t.toFixed(1)}</td>`).join('')}<td class="mono">${grandTotal.toFixed(1)}</td></tr></tfoot>
    </table></div>
  `;
}

function renderAllEntries(){
  const logs = getVisibleTimelogs().slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(!logs.length) return `<div class="empty-state">No time logged yet.</div>`;
  const rows = logs.map(l=>{
    const q = S.quotations.find(x=>x.id===l.quotationId);
    return `<tr class="clickable" data-action="edit-timelog" data-id="${l.id}">
      <td>${formatDate(l.date)}</td>
      <td>${esc(l.engineer)}</td>
      <td>${q?`<span class="qid" style="font-size:12.5px;">${esc(q.qrfId)}</span>`:'<span style="color:var(--ink-soft);">Other Work</span>'}</td>
      <td><span class="wdot wdot-${l.workType.replace(/\s+/g,'')}"></span> ${esc(l.workType)}</td>
      <td class="mono">${parseFloat(l.hours).toFixed(1)}h</td>
      <td>${esc(l.remarks)}</td>
    </tr>`;
  }).join('');
  return `<div class="card table-wrap"><table>
    <thead><tr><th>Date</th><th>Engineer</th><th>Quotation</th><th>Type</th><th>Hours</th><th>Remarks</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

/* ---------------------------------------------------------
   22. SETTINGS PAGE  (Section 2, 15)
   --------------------------------------------------------- */
function renderSettingsPage(){
  const rows = S.users.map(u=>`
    <li class="settings-row">
      <div class="avatar" style="background:${colourFor(u.name)}">${initialsOf(u.name)}</div>
      <div class="rn">
        <div class="n">${esc(u.name)} ${u.name===S.loggedInUser.name?'<span style="color:var(--ink-soft);font-weight:500;font-size:11px;">(you)</span>':''}</div>
        <div class="r">${esc(u.role)}${u.role==='Design Engineer' && u.assignedTeamLead ? ' · reports to '+esc(u.assignedTeamLead) : ''}</div>
      </div>
      <div class="settings-actions">
        <button class="btn btn-sm" data-action="edit-user" data-name="${escAttr(u.name)}">Edit</button>
        <button class="btn btn-sm" data-action="reset-pin" data-name="${escAttr(u.name)}">Reset PIN</button>
        ${u.name!==S.loggedInUser.name?`<button class="btn btn-sm btn-danger" data-action="delete-user" data-name="${escAttr(u.name)}">Remove</button>`:''}
      </div>
    </li>`).join('');

  const themeCards = THEMES.map(t=>`
    <div class="theme-card ${S.theme===t.id?'active':''}" data-action="pick-theme" data-id="${t.id}">
      <div class="theme-preview"><div class="a" style="background:${t.sidebar}"></div><div class="b" style="background:linear-gradient(135deg,${t.accent},${t.accent2})"></div></div>
      <div class="tname">${esc(t.name)}</div>
    </div>`).join('');

  return `
    <div class="section-head"><h2>Team</h2><span class="count">${S.users.length}</span>
      <button class="btn btn-primary" style="margin-left:auto;" data-action="new-user">+ Add member</button>
    </div>
    <ul class="settings-list">${rows}</ul>

    <div class="section-head"><h2>Theme</h2></div>
    <div class="theme-grid">${themeCards}</div>
  `;
}

function openUserFormModal(name){
  const existing = name ? S.users.find(u=>u.name===name) : null;
  S.uForm = existing ? {mode:'edit', origName:existing.name, name:existing.name, role:existing.role, assignedTeamLead:existing.assignedTeamLead||'', pin:existing.pin, errors:{}}
                      : {mode:'new', origName:null, name:'', role:'Design Engineer', assignedTeamLead:'', pin:'', errors:{}};
  renderUserFormModal();
}
function renderUserFormModal(){
  const f = S.uForm;
  const tlOptions = S.users.filter(u=>u.role==='Team Lead' || u.role==='Full Access');
  const html = `
    <div class="modal-head"><h3>${f.mode==='new'?'Add team member':'Edit team member'}</h3><button class="modal-close" data-action="close-modal">&times;</button></div>
    <div class="modal-body">
      <div class="form-row"><label>Name <span class="req">*</span></label>
        <input type="text" id="u-name" value="${escAttr(f.name)}">
        ${f.errors.name?`<div class="login-err">${esc(f.errors.name)}</div>`:''}
      </div>
      <div class="form-row"><label>Role <span class="req">*</span></label>
        <select id="u-role">${ROLES.map(r=>`<option value="${r}" ${f.role===r?'selected':''}>${r}</option>`).join('')}</select>
      </div>
      <div class="form-row" id="u-tl-wrap" style="${f.role!=='Design Engineer'?'display:none;':''}">
        <label>Reports to (Team Lead)</label>
        <select id="u-tl"><option value="">None</option>${tlOptions.map(t=>`<option value="${escAttr(t.name)}" ${f.assignedTeamLead===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
      </div>
      <div class="form-row"><label>4-digit PIN <span class="req">*</span></label>
        <input type="text" id="u-pin" maxlength="4" value="${escAttr(f.pin)}" placeholder="1234">
        ${f.errors.pin?`<div class="login-err">${esc(f.errors.pin)}</div>`:''}
      </div>
      <div class="legend-note">* Required field</div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-action="close-modal">Cancel</button>
      <button class="btn btn-primary" data-action="save-user">Save</button>
    </div>`;
  openModal(html);
  document.getElementById('u-name').oninput = e=> f.name = e.target.value;
  document.getElementById('u-pin').oninput = e=> f.pin = e.target.value.replace(/\D/g,'').slice(0,4);
  document.getElementById('u-role').onchange = e=>{ f.role=e.target.value; renderUserFormModal(); };
  const tlSel = document.getElementById('u-tl');
  if(tlSel) tlSel.onchange = e=> f.assignedTeamLead = e.target.value;
}
function saveUserFromForm(){
  const f = S.uForm; f.errors={};
  if(!f.name.trim()) f.errors.name='Name is required.';
  if(!f.pin || f.pin.length!==4) f.errors.pin='PIN must be exactly 4 digits.';
  const dupe = S.users.find(u=>u.name.toLowerCase()===f.name.trim().toLowerCase() && u.name!==f.origName);
  if(dupe) f.errors.name='Someone with that name already exists.';
  if(Object.keys(f.errors).length){ renderUserFormModal(); return; }

  if(f.mode==='new'){
    S.users.push({name:f.name.trim(), role:f.role, colour: THEMES[0].accent, initials: initialsOf(f.name.trim()), assignedTeamLead: f.role==='Design Engineer'?f.assignedTeamLead:'', pin:f.pin});
  } else {
    const u = S.users.find(x=>x.name===f.origName);
    if(u){ u.name=f.name.trim(); u.role=f.role; u.assignedTeamLead = f.role==='Design Engineer'?f.assignedTeamLead:''; u.pin=f.pin; u.initials=initialsOf(f.name.trim());
      // keep quotations/timelogs consistent if the name changed
      if(f.origName!==u.name){
        S.quotations.forEach(q=>{ if(q.teamLead===f.origName) q.teamLead=u.name; if(q.engineer===f.origName) q.engineer=u.name; });
        S.timelogs.forEach(t=>{ if(t.engineer===f.origName) t.engineer=u.name; });
        if(S.loggedInUser.name===f.origName) S.loggedInUser=u;
      }
    }
  }
  saveCache();
  closeModal();
  renderApp();
  toast('Team updated.', 'ok');
  api.post('saveUsers', {users:S.users}).then(r=>{ if(r && r.ok===false && !r.offline) toast('Saved locally — will retry syncing.', 'err'); });
}
function resetUserPin(name){
  const u = S.users.find(x=>x.name===name); if(!u) return;
  const np = prompt(`New 4-digit PIN for ${name}:`, '');
  if(np===null) return;
  const clean = np.replace(/\D/g,'').slice(0,4);
  if(clean.length!==4){ toast('PIN must be exactly 4 digits.', 'err'); return; }
  u.pin = clean;
  saveCache();
  renderApp();
  toast(`PIN reset for ${name}.`, 'ok');
  api.post('saveUsers', {users:S.users}).then(r=>{ if(r && r.ok===false && !r.offline) toast('Saved locally — will retry syncing.', 'err'); });
}
function deleteUserConfirm(name){
  if(!confirm(`Remove ${name} from the team? Their past time logs stay intact.`)) return;
  S.users = S.users.filter(u=>u.name!==name);
  saveCache();
  renderApp();
  toast('Removed from team.', 'ok');
  api.post('saveUsers', {users:S.users}).then(r=>{ if(r && r.ok===false && !r.offline) toast('Saved locally — will retry syncing.', 'err'); });
}
function pickTheme(id){
  applyTheme(id);
  renderApp();
}

function renderQuotationsKanban(qs){
  return `<div class="kanban">
    ${STATUS_LIST.map(s=>{
      const col = qs.filter(q=>q.status===s);
      return `<div class="kanban-col">
        <div class="kh"><span>${esc(s)}</span><span>${col.length}</span></div>
        ${col.map(q=>`
          <div class="kcard" data-action="open-quotation" data-id="${q.id}">
            <div class="qid">${esc(q.qrfId)}<span class="rev-tag">Rev ${esc(q.revisionNumber||'0')}</span></div>
            <div class="client">${esc(q.clientName)}</div>
            <div class="meta">
              <span>${esc(q.engineer||'Unassigned')}</span>
              <span>${q.deadline?formatDate(q.deadline):''}${isDelayed(q)?' &#9888;':''}</span>
            </div>
          </div>`).join('') || `<div class="empty-note" style="padding:8px 4px;">Empty</div>`}
      </div>`;
    }).join('')}
  </div>`;
}
